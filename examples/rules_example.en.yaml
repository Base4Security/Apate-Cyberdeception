# Synthetic condition/action rules for the local Apate Core walkthrough.

rules:
  - name: "Scan on honeypot-mock-1: deploy the second mock and activate the operation"
    when:
      event_type: interaction
      plugin_id: honeypot-mock-1
      payload:
        kind: scan
    then:
      - action: deploy
        plugin_id: honeypot-mock-2
      - action: transition
        to: active

  - name: "Access to honeypot-mock-1: mark the operation compromised"
    when:
      event_type: interaction
      plugin_id: honeypot-mock-1
      payload:
        kind: access
    then:
      - action: transition
        to: compromised

  - name: "Close when due: retire all plugins and close the operation"
    when:
      closure_due: true
    then:
      - action: retire
      - action: transition
        to: closed
