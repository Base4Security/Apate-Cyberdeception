# Configuracion de extraccion de mensajes traducibles (pybabel extract).
#
# El idioma fuente es el espanol: los `msgid` del catalogo son las frases
# tal como estan escritas en el codigo, y el ingles vive como traduccion.
# Ver `src/apate/i18n.py` para por que se eligio asi.
#
# Se extrae de todo `src/apate`, no solo de `apate.web`: el texto visible
# tambien vive en los informes (`apate.reporting`), en la metadata del
# catalogo de capacidades (`apate.plugins`) y en la validacion del CSV del
# inventario (`apate.assets`). El codigo vendorizado de DOLOS-T y BUDA
# (`src/DOLOST`, `src/BUDA`) queda afuera a proposito: son copias
# congeladas de otro proyecto y traducirlas las volveria imposibles de
# actualizar contra su origen.

[python: src/apate/**.py]

[jinja2: src/apate/web/templates/**.html]
extensions = jinja2.ext.i18n
