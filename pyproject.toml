[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apate"
version = "0.1.0a1"
description = "Core abierto para modelar y orquestar operaciones de ciberengaño"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Federico Pacheco" }]
maintainers = [{ name = "BASE4 Security" }]
keywords = ["cyberdeception", "orchestration", "deception"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
